
<!DOCTYPE html>
<html>
<head>
    <title>AI Student Prediction System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>AI Student Performance Prediction</h2>

    <label>Study Hours per Day:</label>
    <input type="number" id="hours" placeholder="Enter study hours">

    <label>Attendance (%):</label>
    <input type="number" id="attendance" placeholder="Enter attendance">

    <label>Previous Marks (%):</label>
    <input type="number" id="marks" placeholder="Enter previous marks">

    <br>

    <button onclick="predict()">Predict</button>

    <div id="result"></div>

</div>

<script>

function predict() {

    let hours = Number(document.getElementById("hours").value);
    let attendance = Number(document.getElementById("attendance").value);
    let marks = Number(document.getElementById("marks").value);

    // Simple AI-like scoring model
    let score =
        (hours * 10) +
        (attendance * 0.3) +
        (marks * 0.4);

    if (score >= 80) {
        document.getElementById("result").innerHTML =
            "Prediction: Student is likely to PASS";
    }
    else {
        document.getElementById("result").innerHTML =
            "Prediction: Student needs IMPROVEMENT";
    }
}

</script>

</body>
</html>
